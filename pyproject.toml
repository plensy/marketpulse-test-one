# 1. Project metadata: name, version, dependencies
[project]
name = "marketpulse"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "dash>=2.15"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

# 2. How to build the package (so that `pip install .` works)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 3. Tool settings: each tool reads its own [tool.xxx] section
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]